[package]
name = "etkilesim-takip"
version = "0.1.0"
description = "Etkileşim Takip masaüstü kabuğu — created by axthrowa"
authors = ["axthrowa"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
