[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etkilesim-engine"
version = "0.1.0"
description = "Etkileşim Takip motoru: ölçüm, duygu analizi, topluluk radarı, uyarı sistemi. created by axthrowa"
authors = [{ name = "axthrowa" }]
requires-python = ">=3.11"
dependencies = [
  "apscheduler>=3.10,<4",
  "keyring>=25",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
nlp = ["transformers>=4.40", "torch"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pip-audit>=2.7"]

[tool.setuptools]
packages = ["etkilesim"]

[tool.setuptools.package-data]
etkilesim = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]
"etkilesim/migrations.py" = ["E501"]
"etkilesim/topics.py" = ["E501"]
"etkilesim/cli.py" = ["BLE001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["etkilesim"]
ignore_missing_imports = true
